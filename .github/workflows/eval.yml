name: Eval subset

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of dev questions to evaluate
        default: "10"
      answers:
        description: Also generate answers and score citations (needs GEMINI_API_KEY secret)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Run eval
        run: |
          flags=""
          if [ "${{ inputs.answers }}" = "true" ]; then flags="--answers --delay 4"; fi
          python -m eval.run --config ci-subset --chunker treesitter --mode vector \
            --split dev --limit "${{ inputs.limit }}" --results-dir eval/results/ci $flags
      - name: Post metrics table
        run: |
          echo "## Eval on ${{ inputs.limit }} dev questions (tree-sitter + vector)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python -m eval.compare --results-dir eval/results/ci >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/ci
