name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,frontend]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: |
          set +e
          pytest -o addopts="" -q -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.log | while read -r line; do echo "::error title=pytest::$line"; done
          exit $status

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t codebase-qa:ci .
