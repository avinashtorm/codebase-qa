[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codebase-qa"
version = "0.1.0"
description = "Ask questions about a GitHub repository and get answers that cite exact file paths and line numbers."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "tree-sitter-language-pack>=0.7",
    "bm25s>=0.2",
    "google-genai>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
frontend = [
    "streamlit>=1.38",
    "pygments>=2.18",
    "requests>=2.32",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/codebase_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src", "."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["codebase_qa", "eval"]
