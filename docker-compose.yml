name: codebase-qa

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: .
    image: codebase-qa:latest
    command: ["uvicorn", "codebase_qa.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATA_DIR: /app/data
      TRUST_PROXY: "true"
      LLM_CACHE: "true"
    volumes:
      - app-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build: .
    image: codebase-qa:latest
    command:
      - streamlit
      - run
      - frontend/app.py
      - --server.port=7860
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
      - --client.showErrorDetails=none
    environment:
      BACKEND_URL: http://backend:8000
    expose:
      - "7860"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2.10
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. my-codebase-qa.indiasouthcentral.cloudapp.azure.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  app-data:
  caddy-data:
  caddy-config:
